name: CI

# The standard's gate (FLR-T-0.3, FLR-ADR-009): the spec's tagging rules → the schemas against every
# suite (Core 0.1, 0.2 and 0.3 documents; Ops 0.1, 0.2 and 0.3 requests; Rules 0.1 requests, packs, profiles
# and reports) → MUST coverage of the current drafts (FS-CORE 0.3, FS-OPS 0.3, FS-RULES 0.1) and of
# every extension specification in registry/ (FS-ELEC, FS-PLMB, FS-MECH, FS-LOWV, FS-FURN, FS-STRC) → the independent
# oracle reproducing every expected output of the Core and Ops suites, of every extension suite
# (conformance/ext/) and of the Rules suite (every report byte for byte), and every committed Ops
# result's resolved echo and inverse → the suites being exactly what their author scripts declare →
# the published drafts (Core 0.1 and 0.2, Ops 0.1 and 0.2, the registry entry schema 0.1) being
# exactly as published.
# The rule packs (rules/, FLR-T-6.3): schemas, the rule-text lint, assembly into the evaluator's pack
# object, every fixture evaluated by the oracle, and the coverage matrices - all as committed.
# A MUST without a test, a test naming an unknown or retired statement, an expected value the oracle
# does not reproduce, or a change to a published schema or suite fails the build.
#
# GitHub-hosted runners only (this repo is public). Every action is pinned to a commit SHA — the
# same SHAs Foreman and D3 Floorspec pin.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Normative statements are tagged correctly
        run: pnpm statements
      - name: The schemas agree with every suite (Core 0.1, 0.2 and 0.3 documents, Ops 0.1, 0.2 and 0.3 requests, the extensions' data, Rules 0.1)
        run: pnpm schema:check
      - name: Every MUST of Core 0.3, Ops 0.3, Rules 0.1 and every extension has a conformance test
        run: pnpm coverage
      - name: The FS_furniture starter library is exactly what its generator writes
        run: pnpm library:check
      - name: The US starter type library is exactly what its generator writes, and every published version matches its SHA256SUMS
        run: pnpm library:us:check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: build/

  oracle:
    needs: spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # the published drafts are compared with the commits that published them
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Oracle unit tests
        run: python -m unittest discover -s tools/oracle -p 'test_*.py'
      - name: The oracle reproduces every expected output of the Core 0.1, Core 0.2, Core 0.3, Ops 0.1, Ops 0.2, Ops 0.3, extension, Rules 0.1 and migration suites
        run: python -m tools.oracle.regenerate
      - name: Every suite is exactly what its author script declares
        run: |
          python -m tools.oracle.author
          python -m tools.oracle.author02
          python -m tools.oracle.author03
          python -m tools.oracle.ops_author
          python -m tools.oracle.ops_author02
          python -m tools.oracle.ops_author03
          python -m tools.oracle.ext_author
          python -m tools.oracle.rules_author
          python -m tools.oracle.migrate_author
          git diff --exit-code -- conformance
          test -z "$(git status --porcelain -- conformance)"
      - name: The published drafts are unchanged (Core 0.1 as of e687d44, Ops 0.1 as published at 3bf4f35, Core 0.2, Ops 0.2 and the registry entry schema as published at 6f9bc07)
        run: |
          git diff --exit-code e687d44 -- schema/core/0.1 conformance/core/0.1
          git diff --exit-code 3bf4f35 -- schema/ops/0.1 conformance/ops/0.1
          git diff --exit-code 6f9bc07 -- schema/core/0.2 conformance/core/0.2 schema/ops/0.2 conformance/ops/0.2 schema/registry/0.1

  packs:
    needs: spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - name: Every rule pack builds, lints clean, passes its fixtures under the oracle, and its generated files and coverage matrices are as committed
        run: pnpm packs:check
        env:
          FLOORSPEC_PYTHON: python
